<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Diagnostica animazioni</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 56px;
    background: #0a0a0b; color: #f2eded;
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: .01em; }
  .sub { color: #f2eded99; font-size: 12px; margin: 0 0 16px; }
  .banner {
    border-radius: 12px; padding: 14px 16px; margin: 0 0 14px;
    font-weight: 700; font-size: 16px; line-height: 1.35;
  }
  .ok   { background: #12351f; color: #7ee2a8; border: 1px solid #7ee2a855; }
  .bad  { background: #3a1216; color: #ff9aa5; border: 1px solid #ff9aa555; }
  .warn { background: #3a2c10; color: #ffd479; border: 1px solid #ffd47955; }
  dl {
    margin: 0 0 18px; display: grid;
    grid-template-columns: minmax(118px, 44%) 1fr;
    gap: 7px 10px; font-size: 13px;
  }
  dt { color: #f2ededa6; }
  dd { margin: 0; word-break: break-word; }
  dd.good { color: #7ee2a8; }
  dd.bad  { color: #ff9aa5; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .16em; color: #f2eded99;
       margin: 22px 0 10px; font-weight: 600; }
  .demo { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
  .box {
    width: 54px; height: 54px; border-radius: 10px; background: #fc6003;
    animation: slide 1.1s ease-in-out infinite alternate;
  }
  @keyframes slide { from { transform: translateX(0) } to { transform: translateX(34px) } }
  .filtered {
    font: 900 22px/1 ui-sans-serif, system-ui, sans-serif; color: #fc6003;
    filter: url(#organic-demo); margin: 8px 0 0;
  }
  button {
    width: 100%; margin-top: 22px; padding: 14px 16px; border-radius: 12px;
    border: 1px solid #f2eded33; background: #1a1a1c; color: #f2eded;
    font: 600 15px ui-monospace, monospace;
  }
  button:active { background: #26262a; }
  pre {
    margin: 14px 0 0; padding: 12px; border-radius: 10px; background: #131316;
    border: 1px solid #f2eded1a; font-size: 11px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto;
  }
</style>
</head>
<body>
  <h1>Diagnostica animazioni</h1>
  <p class="sub">Apri questa pagina sul telefono. Misura da sola, in 3 secondi.</p>

  <div id="verdetto" class="banner warn">misurazione in corso…</div>
  <dl id="tabella"></dl>

  <h2>Prove visive</h2>
  <div class="demo">
    <div class="box"></div>
    <span style="font-size:12px;color:#f2eded99">quadrato CSS:<br />deve scorrere</span>
  </div>
  <p class="filtered" id="filtered">Alessandro Fratello</p>
  <p style="font-size:12px;color:#f2eded99;margin:2px 0 0">
    scritta con filtro SVG: deve vibrare nei bordi
  </p>

  <button id="copia" type="button">Copia il risultato</button>
  <pre id="json">…</pre>

  <!-- filtro identico a quello del footer del sito -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0" focusable="false">
    <defs>
      <filter id="organic-demo" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.07" numOctaves="3" result="noise">
          <animate attributeName="baseFrequency"
                   values="0.012 0.05; 0.025 0.11; 0.016 0.08; 0.012 0.05"
                   dur="4.5s" repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"
                           xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- cerchio per testare lo SMIL in modo numerico -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0">
    <circle id="smilC" cx="5" cy="5" r="1">
      <animate attributeName="r" values="1;9;1" dur="1s" repeatCount="indefinite" />
    </circle>
  </svg>

<script>
(function () {
  "use strict";

  var out = {};
  var errori = [];
  window.addEventListener("error", function (e) {
    errori.push("error: " + (e.message || e.type));
  });
  window.addEventListener("unhandledrejection", function (e) {
    errori.push("promise: " + String((e.reason && e.reason.message) || e.reason));
  });

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function fps() {
    return new Promise(function (resolve) {
      var n = 0, t0 = performance.now();
      function tick() {
        n++;
        if (performance.now() - t0 < 1000) requestAnimationFrame(tick);
        else resolve(n);
      }
      requestAnimationFrame(tick);
    });
  }

  async function cssAnima() {
    var box = document.querySelector(".box");
    var a = getComputedStyle(box).transform;
    await sleep(320);
    var b = getComputedStyle(box).transform;
    return a !== b;
  }

  async function smilAnima() {
    var c = document.getElementById("smilC");
    if (!c || !c.r) return null;
    // ATTENZIONE: baseVal resta il valore dichiarato; il valore animato da SMIL
    // sta in animVal. Con baseVal il test direbbe sempre "fermo".
    var a = c.r.animVal.value;
    await sleep(320);
    var b = c.r.animVal.value;
    return a !== b;
  }

  function webgl() {
    try {
      var cv = document.createElement("canvas");
      var gl = cv.getContext("webgl2") || cv.getContext("webgl");
      if (!gl) return { ok: false };
      var dbg = gl.getExtension("WEBGL_debug_renderer_info");
      return {
        ok: true,
        renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
        versione: gl.getParameter(gl.VERSION)
      };
    } catch (e) {
      return { ok: false, errore: String(e) };
    }
  }

  function riga(chiave, valore, classe) {
    var dt = document.createElement("dt");
    dt.textContent = chiave;
    var dd = document.createElement("dd");
    dd.textContent = valore;
    if (classe) dd.className = classe;
    document.getElementById("tabella").appendChild(dt);
    document.getElementById("tabella").appendChild(dd);
  }

  function siNo(v) { return v ? "SÌ" : "NO"; }

  (async function misura() {
    var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var noPref = matchMedia("(prefers-reduced-motion: no-preference)").matches;
    var coarse = matchMedia("(pointer: coarse)").matches;
    var hoverNone = matchMedia("(hover: none)").matches;

    out.reduceMotion = reduce;
    out.noPreference = noPref;
    out.pointerCoarse = coarse;
    out.hoverNone = hoverNone;
    out.userAgent = navigator.userAgent;
    out.mobile = navigator.userAgentData ? navigator.userAgentData.mobile : null;
    out.platform = navigator.userAgentData ? navigator.userAgentData.platform : null;
    out.lingua = navigator.language;
    out.viewport = innerWidth + "x" + innerHeight + " · dpr " + devicePixelRatio;
    out.screen = screen.width + "x" + screen.height;
    out.secureContext = isSecureContext;
    out.visibility = document.visibilityState;
    out.hardwareConcurrency = navigator.hardwareConcurrency || null;
    out.deviceMemory = navigator.deviceMemory || null;
    out.saveData = navigator.connection ? !!navigator.connection.saveData : null;
    out.connection = navigator.connection ? navigator.connection.effectiveType : null;

    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      try {
        var hi = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
        out.modello = hi.model || null;
        out.platformVersion = hi.platformVersion || null;
      } catch (e) { /* opzionale */ }
    }

    out.fps = await fps();
    out.cssAnimation = await cssAnima();
    out.smilAnimation = await smilAnima();
    out.webgl = webgl();
    out.intersectionObserver = typeof IntersectionObserver !== "undefined";
    out.nativeViewTransition = typeof document.startViewTransition === "function";
    out.supports_filter_url = CSS.supports("filter", "url(#x)");
    out.supports_mask = CSS.supports("mask-image", "linear-gradient(#000,#000)");
    out.supports_webkit_mask = CSS.supports("-webkit-mask-image", "linear-gradient(#000,#000)");
    out.errori = errori;

    // ── tabella ────────────────────────────────────────────────────────────
    riga("Riduci movimento", reduce ? "ATTIVO (animazioni spente dal sistema)" : "spento",
         reduce ? "bad" : "good");
    riga("modello", (out.modello || "n/d") + (out.platform ? " · " + out.platform : ""));
    riga("Android", out.platformVersion || "n/d");
    riga("Chrome", (navigator.userAgent.match(/Chrome\/(\d+)/) || [])[1] || "n/d");
    riga("viewport", out.viewport);
    riga("puntatore", coarse ? "coarse (touch)" : "fine");
    riga("fps misurati", out.fps + " in 1s", out.fps < 30 ? "bad" : "good");
    riga("animazione CSS", siNo(out.cssAnimation), out.cssAnimation ? "good" : "bad");
    riga("animazione SVG", out.smilAnimation === null ? "n/d" : siNo(out.smilAnimation),
         out.smilAnimation ? "good" : "bad");
    riga("WebGL", out.webgl.ok ? "sì" : "NO", out.webgl.ok ? "good" : "bad");
    riga("mask-image", siNo(out.supports_mask), out.supports_mask ? "good" : "bad");
    riga("errori JS", errori.length ? errori.join(" · ") : "nessuno",
         errori.length ? "bad" : "good");

    // ── verdetto ───────────────────────────────────────────────────────────
    var v = document.getElementById("verdetto");
    if (reduce) {
      v.className = "banner bad";
      v.textContent = "Il telefono dichiara «RIDUCI MOVIMENTO» ATTIVO: il sito spegne intenzionalmente intro, ciborg e footer.";
    } else if (!out.cssAnimation) {
      v.className = "banner bad";
      v.textContent = "Riduci movimento è spento, ma le animazioni CSS non si muovono: è un problema del browser/dispositivo.";
    } else if (!out.smilAnimation) {
      v.className = "banner warn";
      v.textContent = "CSS ok, ma l'animazione SVG è ferma: il footer e il filtro resterebbero statici.";
    } else {
      v.className = "banner ok";
      v.textContent = "Animazioni attive su questo telefono: intro, ciborg e footer possono funzionare.";
    }

    document.getElementById("json").textContent = JSON.stringify(out, null, 2);
  })();

  document.getElementById("copia").addEventListener("click", async function () {
    var btn = this;
    var testo = document.getElementById("json").textContent;
    try {
      await navigator.clipboard.writeText(testo);
      btn.textContent = "Copiato ✓";
    } catch (e) {
      var r = document.createRange();
      r.selectNodeContents(document.getElementById("json"));
      var s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
      btn.textContent = "Selezionato: copia a mano";
    }
    setTimeout(function () { btn.textContent = "Copia il risultato"; }, 2500);
  });
})();
</script>
</body>
</html>
