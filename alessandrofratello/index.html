    <!-- Font non bloccanti: con media="print" il browser non aspetta Google
         per dipingere (prima il primo paint slittava di ~1s su rete mobile).
         Lo swap avviene sotto l'intro, quindi non si vede. -->
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- La hero è dentro React: senza questo il browser la scopre solo dopo
         aver scaricato il bundle e montato l'app (secondi su rete mobile).
         Precaricandola qui, il download parte subito insieme al resto. -->
    <link rel="preload" as="image" href="/alessandrofratello/photo/hero/hero1.webp" type="image/webp" fetchpriority="high" />
    <!-- Al refresh il browser ripristina l'ultima posizione: la pagina deve
         ripartire dall'header/hero. Deve essere INLINE e prima del body —
         i module script sono deferred e arrivano troppo tardi (il ripristino
         avviene comunque e resta). -->
    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      window.scrollTo(0, 0);
      window.addEventListener("pageshow", function (e) {
        if (e.persisted) window.scrollTo(0, 0);
      });
    </script>
    <!-- Rete di sicurezza, solo per guasti veri. Regole:
         · se il file JS non si scarica (404 dopo un deploy, modulo bloccato
           dalla rete) si ricarica UNA volta con `?r=…` per saltare la cache;
         · nessun reload a tempo: un caricamento lento non è un guasto, e
           ricaricare mentre il bundle sta arrivando lo rende solo peggiore;
         · se l'app va in errore prima di montare, si mostra un messaggio con
           il pulsante (il testo dell'errore finisce sotto, per diagnosi).
         Il messaggio si toglie da solo appena l'app monta. -->
    <script>
      (function () {
        var KEY = "cv-boot-retry";
        var detail = "";
        function alive() {
          var root = document.getElementById("root");
          return !!window.__cvAlive || !!(root && root.children.length);
        }
        function clear() {
          var d = document.getElementById("boot-fail");
          if (d) d.remove();
        }
        function retryOnce() {
          if (alive()) return true;
          try {
            if (sessionStorage.getItem(KEY) === "1") return false;
            sessionStorage.setItem(KEY, "1");
          } catch (e) {
            return false;
          }
          var u = new URL(location.href);
          u.searchParams.set("r", Date.now().toString(36));
          location.replace(u.toString());
          return true;
        }
        function overlay(msg) {
          if (alive() || document.getElementById("boot-fail")) return;
          if (msg) detail = msg;
          var d = document.createElement("div");
          d.id = "boot-fail";
          d.setAttribute("role", "alert");
          d.style.cssText =
            "position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;background:#01070B;color:#FCFCFD;font-family:Inter,system-ui,-apple-system,sans-serif";
          var p = document.createElement("p");
          p.textContent = "Il sito non è riuscito a caricarsi. Controlla la connessione e riprova.";
          p.style.cssText = "margin:0;max-width:34ch;font-size:15px;line-height:1.5;color:#9AA3AD";
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = "Ricarica";
          b.style.cssText =
            "font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 24px;border:0;border-radius:999px;background:#FC6003;color:#01070B;cursor:pointer";
          b.addEventListener("click", function () {
            try {
              sessionStorage.removeItem(KEY);
            } catch (e) {}
            location.reload();
          });
          d.appendChild(p);
          d.appendChild(b);
          if (detail) {
            var s = document.createElement("p");
            s.textContent = detail.slice(0, 160);
            s.style.cssText =
              "margin:0;max-width:60ch;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5B6470;word-break:break-word";
            d.appendChild(s);
          }
          document.body.appendChild(d);
        }
        // il bundle non è stato scaricato: unico caso in cui ricaricare aiuta
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || t.tagName !== "SCRIPT") return;
            if (!retryOnce()) overlay("Non riesco a scaricare " + (t.src || "il file JS"));
          },
          true
        );
        // errore vero prima del mount: niente reload (sarebbe identico)
        window.addEventListener("error", function (e) {
          if (alive() || (e.target && e.target.tagName === "SCRIPT")) return;
          overlay(e.message || "Errore JavaScript in avvio");
        });
        window.addEventListener("unhandledrejection", function (e) {
          if (alive()) return;
          var r = e.reason;
          overlay((r && (r.message || String(r))) || "Promise rifiutata in avvio");
        });
        // ultima spiaggia: dopo 25s senza app, si mostra il messaggio (niente reload)
        setTimeout(function () {
          if (!alive()) overlay("");
        }, 25000);
        window.__cvBootFail = overlay;
        window.__cvBootClear = clear;
      })();
    </script>

  <body>
    <!-- Sfondo di avvio: React impiega 1-2s su un telefono a montare, e senza
         questo si vedrebbe bianco. È dello stesso nero dell'intro, quindi il
         passaggio al pannello dell'intro non si nota. Rimosso al primo render. -->
    <div id="boot" aria-hidden="true" style="position:fixed;inset:0;background:#01070B;z-index:0"></div>
    <div id="root"></div>
